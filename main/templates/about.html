<!DOCTYPE html>
<html>

<head>
    <title>{{ profile.name }} | About</title>
</head>

<body style="margin:0; background:#0f172a; color:white; font-family:Arial, sans-serif;">

    <!-- HEADER -->
    <div style="background:#020617; padding:40px; text-align:center; border-bottom: 2px solid #22d3ee;">
        <h1 style="margin:0; font-size:40px; color:#22d3ee;">About {{ profile.name }}</h1>
        <p style="margin-top:10px; font-size:20px; color:#cbd5e1;">{{ profile.title }}</p>
    </div>

    <!-- BIO SECTION -->
    <div
        style="max-width:800px; margin:50px auto; padding:20px; text-align:center; border:1px solid #334155; border-radius:15px; background:#1e293b;">
        <h2 style="color:#38bdf8;">Profile</h2>
        <p style="line-height:1.8; font-size:17px; color:#e2e8f0;">
            {{ profile.bio }}
        </p>
    </div>

    <!-- SKILLS SECTION -->
    <div
        style="max-width:800px; margin:50px auto; padding:20px; border:1px solid #334155; border-radius:15px; background:#1e293b;">
        <h2 style="text-align:center; color:#fbbf24;">Skills</h2>
        <div style="display:flex; flex-wrap:wrap; justify-content:center;">
            {% for skill in skills %}
            <div style="
                background:#0f172a;
                margin:10px;
                padding:12px 20px;
                border-radius:20px;
                border:1px solid #334155;
                font-size:15px;">
                {{ skill.name }}
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- NAVIGATION -->
    <div style="text-align:center; margin:40px;">
        <a href="/" style="text-decoration:none; color:#22d3ee; font-size:18px; margin:15px;">Home</a>
        <a href="/projects" style="text-decoration:none; color:#22d3ee; font-size:18px; margin:15px;">Projects</a>
        <a href="/contact" style="text-decoration:none; color:#22d3ee; font-size:18px; margin:15px;">Contact</a>
    </div>

    <!-- FOOTER -->
    <div style="background:#020617; padding:15px; text-align:center; color:#64748b;">
        © 2025 {{ profile.name }} — Django Portfolio
    </div>

</body>

</html>
