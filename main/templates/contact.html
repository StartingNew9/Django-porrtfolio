<!DOCTYPE html>
<html>

<head>
    <title>Contact | {{ profile.name }}</title>
</head>

<body style="margin:0; background:#0f172a; color:white; font-family:Arial, sans-serif;">

    <!-- HEADER / NAVBAR -->
    <div style="background:#020617; padding:40px; text-align:center; border-bottom:2px solid #22d3ee;">
        <a href="{% url 'home' %}" style="text-decoration:none;">
            <h1 style="margin:0; font-size:40px; color:#22d3ee;">{{ profile.name }}</h1>
        </a>
        <p style="margin-top:10px; font-size:20px; color:#cbd5e1;">Contact</p>
    </div>

    <div style="text-align:center; padding:20px; background:#020617;">
        <a href="{% url 'home' %}" style="text-decoration:none; color:#22d3ee; font-size:17px; margin:15px;">Home</a>
        <a href="{% url 'about' %}" style="text-decoration:none; color:#22d3ee; font-size:17px; margin:15px;">About</a>
        <a href="{% url 'projects' %}"
            style="text-decoration:none; color:#22d3ee; font-size:17px; margin:15px;">Projects</a>
        <a href="{% url 'contact' %}"
            style="text-decoration:none; color:#22d3ee; font-size:17px; margin:15px;">Contact</a>
    </div>


    <!-- CONTACT INFO -->
    <div
        style="max-width:500px; margin:60px auto; padding:35px; background:#020617; border-radius:15px; border:1px solid #334155; text-align:center;">
        <h2 style="color:#c084fc;">Get in Touch</h2>

        {% if contact.email %}
        <p style="color:#e2e8f0; margin:10px 0;">📧 Email: {{ contact.email }}</p>
        {% endif %}

        {% if contact.github %}
        <p style="margin:10px 0;">
            <a href="{{ contact.github }}" style="color:#22d3ee; text-decoration:none;">GitHub Profile</a>
        </p>
        {% endif %}

        {% if contact.linkedin %}
        <p style="margin:10px 0;">
            <a href="{{ contact.linkedin }}" style="color:#22d3ee; text-decoration:none;">LinkedIn</a>
        </p>
        {% endif %}
    </div>

    <!-- FOOTER -->
    <div style="background:#020617; padding:20px; text-align:center; color:#64748b;">
        © 2025 {{ profile.name }} — Django Portfolio
    </div>

</body>

</html>
